  WHAT THIS FILE IS
    The complete app in one self-contained page: markup, styles and logic.
    In the GitHub repository the same code is maintained in a split layout
    (index.html + assets/css/style.css + assets/js/app.js +
    data/questions.json) — this file is the single-file build of it.

  HOW THE CODE IS ORGANISED (search for "SECTION" to jump around)
    CSS  1. Design tokens (light + dark)   2. Base & layout
         3. Header / hero / auth           4. Cards, practice & session UI
         5. Revision, stats, navigation    6. Polish pass
    JS   1. Question bank (130 questions, one entry per question)
         2. Week titles & source gaps      3. State, storage & accounts
         4. Theme & helpers                5. Practice / mock session engine
         6. Learn (study questions)        7. Views (one function per screen)
         8. Router & chrome

  MAINTENANCE RULES
    - One question per entry in the bank, so every change is a small,
      reviewable diff — never edit answers without the source export.
    - Every accepted answer matches the supplied source twice (marked
      option + "Correct Answer:" line); Weeks 1–12 re-verified against the
      owner's NPTEL portal accepted answers — 120/120 match, 0 differences.
      Week 0 answers come from public course material (see Source & Limits).
      See docs/VERIFICATION.md in the repository.
    - The source has NO explanations — never invent one in code or UI.
    - Accounts & progress live in browser local storage on the device
      only. This build is client-only; do not claim otherwise.
    - Keep formatting consistent (Prettier, 2-space indent) when editing.
  ============================================================================
-->
